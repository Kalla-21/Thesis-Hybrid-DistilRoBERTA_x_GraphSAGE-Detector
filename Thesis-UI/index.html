<!DOCTYPE html>
<html>
<head>
    <title>Scam Detector UI</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; font-size: 16px;}
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-size: 1.5em; font-weight: bold; }
        .tabular-group { display: flex; gap: 20px; }
        .tabular-item { flex: 1; }
    </style>
</head>
<body>
    <h2>Check Job Posting</h2>
    
    <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="title" placeholder="e.g. Marketing Intern">
    </div>

    <div class="form-group">
        <label>Company Profile</label>
        <textarea id="company_profile" rows="3" placeholder="Paste company profile here..."></textarea>
    </div>
    
    <div class="form-group">
        <label>Job Description</label>
        <textarea id="description" rows="5" placeholder="Paste description here..."></textarea>
    </div>

    <div class="form-group">
        <label>Requirements</label>
        <textarea id="requirements" rows="3" placeholder="Paste job requirements here..."></textarea>
    </div>

    <div class="form-group">
        <label>Benefits</label>
        <textarea id="benefits" rows="3" placeholder="Paste job benefits here..."></textarea>
    </div>

    <div class="form-group tabular-group">
        <div class="tabular-item">
            <label>Telecommuting?</label>
            <select id="telecommuting">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>
        <div class="tabular-item">
            <label>Has Logo?</label>
            <select id="has_logo">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>
        <div class="tabular-item">
            <label>Has Questions?</label>
            <select id="has_questions">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>
    </div>

    <button onclick="checkScam()">Predict</button>

    <div id="result"></div>

    <script>
        async function checkScam() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "Analyzing...";

            // Gather all 8 fields from the UI
            const payload = {
                title: document.getElementById('title').value || "",
                company_profile: document.getElementById('company_profile').value || "",
                description: document.getElementById('description').value || "",
                requirements: document.getElementById('requirements').value || "",
                benefits: document.getElementById('benefits').value || "",
                telecommuting: parseInt(document.getElementById('telecommuting').value),
                has_company_logo: parseInt(document.getElementById('has_logo').value),
                has_questions: parseInt(document.getElementById('has_questions').value)
            };

            // Send to FastAPI Backend
            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (data.status === "success") {
                    resultDiv.innerText = `Scam Probability: ${data.scam_probability}%`;
                    resultDiv.style.color = data.scam_probability > 50 ? "red" : "green";
                } else {
                    resultDiv.innerText = `Error: ${data.detail}`;
                    resultDiv.style.color = "black";
                }
            } catch (error) {
                resultDiv.innerText = "Error connecting to the backend.";
                resultDiv.style.color = "black";
            }
        }
    </script>
</body>
</html>
